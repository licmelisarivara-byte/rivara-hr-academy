<svg viewBox="0 0 1080 1520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1080" height="1520" rx="44"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1080" height="1520" fill="#0d0d14"/>
    <rect x="0" y="0" width="14" height="1520" fill="#E8006F"/>

    <!-- badge pill -->
    <rect x="108" y="132" width="300" height="76" rx="38" fill="#E8006F"/>
    <text x="258" y="182" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">GRABADO</text>

    <!-- R badge -->
    <rect x="897" y="132" width="82" height="82" rx="20" fill="#E8006F"/>
    <text x="938" y="190" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>

    <!-- eyebrow -->
    <text x="108" y="705" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#8a8a92" letter-spacing="3">6 MÓDULOS · A TU RITMO</text>

    <!-- title -->
    <text x="104" y="822" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Claude para</text>
    <text x="104" y="924" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#E8006F">Selección</text>

    <!-- subtitle -->
    <text x="108" y="1080" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#9a9aa2">Incorporá Claude a tu día a día</text>
    <text x="108" y="1135" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#9a9aa2">de selección, a tu ritmo.</text>
  </g>
